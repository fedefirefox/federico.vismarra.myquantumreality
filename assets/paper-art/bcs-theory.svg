  <rect width="800" height="600" fill="#151515"/>
  <g opacity=".45" stroke="#ddd6c5" stroke-width="2">
    <path d="M80 160H720M80 260H720M80 360H720M80 460H720M140 90V520M260 90V520M380 90V520M500 90V520M620 90V520"/>
  </g>
  <g fill="#f6f3ea">
