  <circle cx="176" cy="220" r="24" fill="#d85c41"/><circle cx="384" cy="220" r="24" fill="#d85c41"/><circle cx="594" cy="220" r="24" fill="#d85c41"/>
  <path d="M116 300H684" stroke="#c3922e" stroke-width="4" stroke-dasharray="14 12"/>
  <text x="52" y="74" fill="#f6f3ea" font-family="Arial, sans-serif" font-size="28" font-weight="700">BCS Theory</text>
  <text x="52" y="116" fill="#cfc6b3" font-family="Arial, sans-serif" font-size="18">Cooper pairing + superconducting gap</text>
