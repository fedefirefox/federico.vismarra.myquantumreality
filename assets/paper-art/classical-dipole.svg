    <path d="M400 160c88 46 128 90 128 140s-40 94-128 140" stroke="#f5eee0" stroke-width="3" opacity=".85"/>
  </g>
  <line x1="400" y1="150" x2="400" y2="450" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
  <circle cx="400" cy="156" r="26" fill="#d85c41"/>
  <circle cx="400" cy="444" r="26" fill="#0f7c80"/>
  <text x="52" y="74" fill="#f5eee0" font-family="Arial, sans-serif" font-size="28" font-weight="700">Classical Dipole Emission</text>
  <text x="52" y="116" fill="#d6ccb5" font-family="Arial, sans-serif" font-size="18">radiation pattern + field geometry</text>
</svg>
