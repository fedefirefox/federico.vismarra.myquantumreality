      <stop offset="0" stop-color="#fff6d8"/>
      <stop offset="0.42" stop-color="#e9a63a"/>
      <stop offset="1" stop-color="#22201c"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>
  <rect width="800" height="600" fill="#191815"/>
  <path d="M0 110H800M0 220H800M0 330H800M0 440H800M120 0V600M260 0V600M400 0V600M540 0V600M680 0V600" stroke="#5c5648" stroke-width="1" opacity=".35"/>
  <circle cx="400" cy="300" r="136" fill="url(#g)" opacity=".65" filter="url(#blur)"/>
  <g fill="none" stroke-linecap="round">
    <path d="M400 122C250 154 176 225 176 300s74 146 224 178" stroke="#f3c35c" stroke-width="8"/>
    <path d="M400 122c150 32 224 103 224 178s-74 146-224 178" stroke="#0f9b9f" stroke-width="8"/>
